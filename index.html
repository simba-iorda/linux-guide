<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux за 2 месяца</title>
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    /* Ранняя установка темы до рендера, чтобы не было вспышки. */
    (function () {
      try {
        const themes = ['mocha','macchiato','frappe','latte','dracula','nord','gruvbox','tokyonight'];
        const stored = localStorage.getItem('linux-tutorial-theme');
        if (stored && themes.includes(stored)) {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- kitty-окно: весь сайт — терминал -->
  <div class="kitty-window" id="kitty-window">
    <main class="terminal-scroll" id="main">
      <div class="loader" id="global-loader">
        <span class="loader-text">Загружаем курс…</span>
      </div>
    </main>

    <!-- powerline-таббар снизу, как в kitty -->
    <nav class="tab-bar" id="tab-bar" aria-label="Навигация по курсу">
      <div class="tab-bar-inner" id="tab-bar-inner"></div>
      <div class="tab-bar-tools">
        <div id="theme-dots" class="theme-dots" aria-label="Выбор темы"></div>
        <button id="reset-progress" class="tab-tool reset-tool" title="Сбросить прогресс">[reset]</button>
        <button id="menu-toggle" class="tab-tool menu-tool" aria-label="Открыть меню" aria-expanded="false">[menu]</button>
      </div>
    </nav>
  </div>

  <!-- мобильный сайдбар модулей -->
  <aside class="sidebar" id="sidebar">
    <nav>
      <ul class="sidebar-list" id="sidebar-list">
        <li>Уроки загружаются…</li>
      </ul>
    </nav>
  </aside>

  <!-- онбординг в стиле login -->
  <div id="onboarding" class="onboarding" hidden>
    <div class="onboarding-terminal">
      <pre class="onboarding-screen"></pre>
      <button id="onboarding-action" class="onboarding-action" hidden>Погнали</button>
    </div>
  </div>

  <script src="assets/vendor/marked.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
