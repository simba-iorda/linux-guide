<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linux за 2 месяца</title>
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function () {
      try {
        const themes = ['mocha','macchiato','frappe','latte','dracula','nord','gruvbox','tokyonight'];
        const stored = localStorage.getItem('linux-tutorial-theme');
        if (stored && themes.includes(stored)) {
          document.documentElement.dataset.theme = stored;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="terminal" id="terminal">
    <div class="scrollback" id="scrollback" aria-live="polite" aria-atomic="false"></div>

    <form class="prompt-line" id="prompt-form" autocomplete="off">
      <span class="prompt" id="prompt-display" aria-hidden="true">user@linux:~$ </span>
      <span class="input-wrap">
        <input
          id="command-input"
          class="command-input"
          type="text"
          spellcheck="false"
          autocapitalize="off"
          autocomplete="off"
          aria-label="Команда"
          autofocus
        >
        <span class="input-ghost" id="input-ghost" aria-hidden="true"></span>
      </span>
    </form>
  </div>

  <div id="onboarding" class="onboarding" hidden>
    <div class="onboarding-terminal">
      <pre class="onboarding-screen" id="onboarding-screen"></pre>
      <button id="onboarding-action" class="onboarding-action" hidden type="button">Погнали</button>
    </div>
  </div>

  <script src="assets/vendor/marked.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
